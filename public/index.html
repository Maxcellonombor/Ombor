<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ombor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#0f1117;--sur:#1a1d27;--sur2:#22263a;--brd:#2e3350;--acc:#4f9cf9;--acc2:#f9a84f;--grn:#3dd68c;--red:#f96060;--yel:#f9d44f;--txt:#e8eaf0;--mut:#6b7280;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
.hdr{background:var(--sur);border-bottom:1px solid var(--brd);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hdr-title{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--acc)}
.hdr-sub{font-size:10px;color:var(--mut);margin-top:2px}
.badge{background:var(--acc);color:#000;font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.ubar{padding:7px 14px;background:var(--sur2);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px}
.ubar label{font-size:11px;color:var(--mut);white-space:nowrap}
.uinput{background:var(--bg);border:1px solid var(--brd);border-radius:6px;color:var(--txt);font-family:var(--mono);font-size:12px;padding:5px 9px;outline:none;width:140px}
.uinput:focus{border-color:var(--acc)}
.sbar{padding:9px 14px;background:var(--sur);border-bottom:1px solid var(--brd);display:flex;gap:8px;align-items:center}
.sinput{flex:1;background:var(--bg);border:1px solid var(--brd);border-radius:8px;color:var(--txt);font-family:var(--sans);font-size:14px;padding:8px 12px;outline:none}
.sinput:focus{border-color:var(--acc)}
.sinput::placeholder{color:var(--mut)}
.exp-btn{background:#1d6b3a;color:#fff;border:none;border-radius:7px;font-family:var(--sans);font-size:11px;font-weight:600;padding:7px 11px;cursor:pointer;white-space:nowrap}
.filters{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;background:var(--sur);border-bottom:1px solid var(--brd);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{background:var(--sur2);border:1px solid var(--brd);border-radius:7px;color:var(--mut);font-family:var(--sans);font-size:11px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.fbtn.on{background:var(--acc);border-color:var(--acc);color:#000;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--brd);border-bottom:1px solid var(--brd)}
.scard{background:var(--sur);padding:10px;text-align:center}
.sval{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--acc);line-height:1}
.slbl{font-size:9px;color:var(--mut);margin-top:3px;text-transform:uppercase;letter-spacing:0.4px}
.htog{margin:7px 14px;padding:8px 12px;background:var(--sur2);border:1px solid var(--brd);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;color:var(--mut);font-size:12px}
.hlist{margin:0 14px 8px;background:var(--sur);border:1px solid var(--brd);border-radius:8px;overflow:hidden;display:none}
.hlist.open{display:block}
.hitem{padding:7px 12px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px;font-size:11px}
.hitem:last-child{border-bottom:none}
.hsign{font-family:var(--mono);font-weight:700;font-size:12px}
.hpl{color:var(--grn)}.hmi{color:var(--red)}
.hmeta{margin-left:auto;font-size:10px;color:var(--mut);text-align:right}
.grp-hdr{display:flex;align-items:center;gap:7px;padding:8px 14px 4px;margin-top:6px}
.grp-name{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--acc2);text-transform:uppercase;letter-spacing:0.8px}
.grp-cnt{font-family:var(--mono);font-size:9px;color:var(--mut);background:var(--sur2);padding:1px 6px;border-radius:8px}
.grp-tot{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--acc2);font-weight:600}
.plist{padding:0 7px 6px}
.pcard{background:var(--sur);border:1px solid var(--brd);border-radius:9px;margin-bottom:5px;display:flex;align-items:center;padding:0 3px 0 12px;overflow:hidden;cursor:pointer}
.pcard.zero{opacity:0.4}
.pinfo{flex:1;padding:9px 0;min-width:0}
.pmodel{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbrand{font-size:10px;color:var(--mut);margin-top:2px}
.pqty{font-family:var(--mono);font-size:20px;font-weight:600;min-width:46px;text-align:center;padding:0 3px}
.qg{color:var(--grn)}.qy{color:var(--yel)}.qr{color:var(--red)}.q0{color:var(--mut)}
.btng{display:flex;flex-direction:column;gap:3px;padding:7px 4px}
.bm,.bp{width:37px;height:31px;border-radius:6px;border:none;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none}
.bm{background:rgba(249,96,96,0.15);color:var(--red);border:1px solid rgba(249,96,96,0.3)}
.bp{background:rgba(61,214,140,0.15);color:var(--grn);border:1px solid rgba(61,214,140,0.3)}
.bm:active{background:rgba(249,96,96,0.3)}.bp:active{background:rgba(61,214,140,0.3)}
.bm:disabled{opacity:0.22;cursor:not-allowed}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.2s}
.ov.open{opacity:1;pointer-events:all}
.obox{background:var(--sur);border-radius:16px 16px 0 0;border:1px solid var(--brd);width:100%;padding:16px 18px 34px;transform:translateY(100%);transition:transform 0.25s cubic-bezier(0.4,0,0.2,1)}
.ov.open .obox{transform:translateY(0)}
.ohdl{width:36px;height:4px;background:var(--brd);border-radius:2px;margin:0 auto 14px}
.otitle{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--acc);margin-bottom:3px}
.osub{font-size:11px;color:var(--mut);margin-bottom:14px}
.mdisp{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.mbbtn{width:62px;height:62px;border-radius:12px;border:none;font-size:28px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mbbtn:active{opacity:0.8}
.mminus{background:rgba(249,96,96,0.18);color:var(--red);border:2px solid rgba(249,96,96,0.4)}
.mplus{background:rgba(61,214,140,0.18);color:var(--grn);border:2px solid rgba(61,214,140,0.4)}
.mnum{font-family:var(--mono);font-size:46px;font-weight:700;color:var(--txt);min-width:70px;text-align:center;line-height:1}
.minrow{display:flex;gap:7px;margin-top:10px}
.minput{flex:1;background:var(--bg);border:1px solid var(--brd);border-radius:9px;color:var(--txt);font-family:var(--mono);font-size:16px;padding:10px 12px;outline:none;text-align:center}
.minput:focus{border-color:var(--acc)}
.mclose{width:100%;padding:12px;background:var(--acc);color:#000;border:none;border-radius:10px;font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}
.cov{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;padding:16px}
.cov.open{opacity:1;pointer-events:all}
.cbox{background:var(--sur);border:1px solid var(--brd);border-radius:14px;padding:20px 18px;width:100%;max-width:420px;transform:scale(0.93);transition:transform 0.2s;max-height:88vh;overflow-y:auto}
.cov.open .cbox{transform:scale(1)}
.cbox h3{font-family:var(--mono);font-size:13px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.field label{font-size:11px;color:var(--mut)}
.field input{background:var(--bg);border:1px solid var(--brd);border-radius:8px;color:var(--txt);font-family:var(--mono);font-size:13px;padding:9px 11px;outline:none;width:100%}
.field input:focus{border-color:var(--acc2)}
.tags{display:flex;flex-wrap:wrap;margin-top:5px;gap:4px}
.tag{background:var(--sur2);border:1px solid var(--brd);border-radius:6px;padding:4px 9px;font-family:var(--mono);font-size:10px;color:var(--mut);cursor:pointer}
.tag.on{background:rgba(249,168,79,0.2);border-color:var(--acc2);color:var(--acc2)}
.eopts{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.eopt{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border:1px solid var(--brd);border-radius:8px;cursor:pointer}
.eopt input[type=checkbox]{width:14px;height:14px;accent-color:var(--acc)}
.eopt span{font-size:12px;color:var(--txt)}
.eopt small{margin-left:auto;font-size:10px;color:var(--mut)}
.arow{display:flex;gap:8px;margin-top:6px}
.bok{flex:1;background:var(--acc2);color:#000;border:none;border-radius:9px;font-family:var(--sans);font-size:14px;font-weight:700;padding:12px;cursor:pointer}
.bok.bl{background:var(--acc)}
.bok:active{opacity:0.85}
.bcx{background:var(--sur2);color:var(--mut);border:1px solid var(--brd);border-radius:9px;font-size:13px;padding:12px 14px;cursor:pointer}
.fab{position:fixed;bottom:22px;right:18px;width:54px;height:54px;border-radius:50%;background:var(--acc2);color:#000;border:none;font-size:26px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:150;box-shadow:0 4px 18px rgba(249,168,79,0.4)}
.fab:active{opacity:0.85}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--sur2);border:1px solid var(--brd);color:var(--txt);font-family:var(--mono);font-size:11px;padding:7px 14px;border-radius:18px;z-index:500;transition:transform 0.2s;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.nores{text-align:center;padding:36px 14px;color:var(--mut);font-family:var(--mono);font-size:12px}
.pb{padding-bottom:80px}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="hdr-title">OMBOR QOLDIQLARI</div><div class="hdr-sub">2026 — Mart oyi</div></div>
  <div class="badge" id="totalBadge">0 dona</div>
</div>
<div class="ubar">
  <label>Ismingiz:</label>
  <input class="uinput" type="text" id="uinput" placeholder="Ism kiriting..." maxlength="20">
</div>
<div class="sbar">
  <input class="sinput" type="text" id="srch" placeholder="Model qidirish..." autocomplete="off" spellcheck="false">
  <button class="exp-btn" onclick="openExp()">&#11015; Excel</button>
</div>
<div class="filters">
  <button class="fbtn on" onclick="setF('all',this)">Barchasi</button>
  <button class="fbtn" onclick="setF('IN GC YUASA',this)">GC YUASA</button>
  <button class="fbtn" onclick="setF('AOKLY',this)">AOKLY</button>
  <button class="fbtn" onclick="setF('LEOCH AGM',this)">LEOCH AGM</button>
  <button class="fbtn" onclick="setF('LEOCH LI-ION',this)">LEOCH Li-Ion</button>
  <button class="fbtn" onclick="setF('zaryadka',this)">Zaryadka</button>
  <button class="fbtn" onclick="setF('zero',this)">Tugagan</button>
</div>
<div class="stats">
  <div class="scard"><div class="sval" id="stTotal">0</div><div class="slbl">Jami dona</div></div>
  <div class="scard"><div class="sval" id="stTypes">0</div><div class="slbl">Tur soni</div></div>
  <div class="scard"><div class="sval" id="stZero" style="color:var(--red)">0</div><div class="slbl">Tugagan</div></div>
</div>
<div class="htog" onclick="toggleH()">
  <span>&#128221; Oxirgi o'zgarishlar</span>
  <span id="hcnt" style="font-family:var(--mono);font-size:10px">0 ta</span>
</div>
<div class="hlist" id="hlist"></div>
<div id="container" class="pb"></div>

<div class="ov" id="pov" onclick="if(event.target===this)closeP()">
  <div class="obox">
    <div class="ohdl"></div>
    <div class="otitle" id="ptitle"></div>
    <div class="osub" id="psub"></div>
    <div class="mdisp">
      <button class="mbbtn mminus" onclick="mch(-1)">&#8722;</button>
      <div class="mnum" id="pnum">0</div>
      <button class="mbbtn mplus" onclick="mch(+1)">+</button>
    </div>
    <div class="minrow">
      <input class="minput" type="number" id="pinput" placeholder="Miqdor" min="1" inputmode="numeric">
      <button class="mbbtn mminus" style="width:48px;height:44px;font-size:19px;border-radius:9px" onclick="mapp(-1)">&#8722;</button>
      <button class="mbbtn mplus" style="width:48px;height:44px;font-size:19px;border-radius:9px" onclick="mapp(+1)">+</button>
    </div>
    <button class="mclose" onclick="closeP()">Yopish</button>
  </div>
</div>

<div class="cov" id="eov" onclick="if(event.target===this)closeExp()">
  <div class="cbox">
    <h3 style="color:var(--grn)">&#11015; Excel Hisobot</h3>
    <div class="field"><label>Oy nomi</label><input type="text" id="eper" value="Mart 2026"></div>
    <div class="eopts">
      <label class="eopt"><input type="checkbox" id="chkSold" checked><span>Sotilgan tavarlar</span><small id="eSC">0</small></label>
      <label class="eopt"><input type="checkbox" id="chkStock" checked><span>Joriy qoldiq</span><small id="eQC">0</small></label>
      <label class="eopt"><input type="checkbox" id="chkZero"><span>Tugagan mahsulotlar</span><small id="eZC">0</small></label>
      <label class="eopt"><input type="checkbox" id="chkHist"><span>Tarix</span><small id="eHC">0</small></label>
    </div>
    <div class="arow">
      <button class="bcx" onclick="closeExp()">Bekor</button>
      <button class="bok bl" onclick="doExport()">&#11015; Yuklab olish</button>
    </div>
  </div>
</div>

<div class="cov" id="aov" onclick="if(event.target===this)closeAdd()">
  <div class="cbox">
    <h3 style="color:var(--acc2)">&#10010; Yangi mahsulot</h3>
    <div class="field">
      <label>Brend</label>
      <input type="text" id="aBrand" placeholder="AOKLY, LEOCH AGM..." list="blist" autocomplete="off">
      <datalist id="blist"></datalist>
    </div>
    <div class="field">
      <label>Guruh (quyidagidan tanlang yoki o'zing yoz)</label>
      <input type="text" id="aGroup" placeholder="AOKLY PzB..." autocomplete="off">
      <div class="tags" id="grpTags"></div>
    </div>
    <div class="field">
      <label>Model nomi</label>
      <input type="text" id="aModel" placeholder="5PzS400..." autocomplete="off">
    </div>
    <div class="field">
      <label>Boshlangich miqdor (dona)</label>
      <input type="number" id="aQty" value="0" min="0" inputmode="numeric">
    </div>
    <div class="arow">
      <button class="bcx" onclick="closeAdd()">Bekor</button>
      <button class="bok" onclick="addProduct()">&#10010; Qo'shish</button>
    </div>
  </div>
</div>

<button class="fab" onclick="openAdd()">+</button>
<div class="toast" id="toast"></div>

function getFilt(){return products.filter(function(p){var mf=filt==='all'||(filt==='zero'&&p.qty===0)||(filt==='zaryadka'&&p.brand==='zaryadka')||p.brand===filt;var ms=!srch||p.model.toLowerCase().includes(srch)||p.brand.toLowerCase().includes(srch)||p.group.toLowerCase().includes(srch);return mf&&ms;});}

function doExport(){var period=document.getElementById('eper').value||'Hisobot';var sheets=[];var esc=function(s){return String(s!=null?s:'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};if(document.getElementById('chkSold').checked){var sd=buildSold();var rows=[[period+' SOTILGAN','','',''],['Guruh','Model','Sotilgan','Joriy']];if(!sd.length){rows.push(["Harakat yo'q",'','','']);}else{var tot=0;var bg={};sd.forEach(function(s){if(!bg[s.group])bg[s.group]=[];bg[s.group].push(s);});Object.keys(bg).forEach(function(g){bg[g].forEach(function(s){rows.push([g,s.model,s.totalSold,s.currentQty]);tot+=s.totalSold;});});rows.push(['','JAMI',tot,'']);}sheets.push({name:'Sotilgan',rows:rows});}
